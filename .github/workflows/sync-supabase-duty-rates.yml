name: Sync Supabase Duty Rates

# DISABLED — WOVE API billing suspended 2026-03-25.
# Data already captured in Supabase (sources: WOVE, WOVE_TODAY).
# Re-enable by restoring the 'on' triggers below when/if access is resumed.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to run (WOVE API disabled — may incur charges)'
        required: true

jobs:
  sync-duty-rates:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'CONFIRM' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Pass 1: Pre-SC ruling snapshot — entryDate=2026-02-15 (validated baseline)
      # IEEPA surcharges baseline before the ruling period switch.
      # Writes to source=WOVE / WOVE_STAGING
      - name: Sync pre-SC ruling rates (WOVE — 15 Feb 2026 baseline)
        env:
          WOVE_CLIENT_ID: ${{ secrets.WOVE_CLIENT_ID }}
          WOVE_CLIENT_SECRET: ${{ secrets.WOVE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESET_EXISTING: "true"
          WOVE_REQUEST_DELAY_MS: "300"
          WOVE_MAX_RETRIES: "6"
          WOVE_RETRY_BASE_MS: "1500"
          WOVE_RETRY_JITTER_MS: "400"
          WOVE_ENTRY_DATE: "2026-02-15"
          WOVE_SOURCE_LIVE: "WOVE"
          WOVE_SOURCE_STAGING: "WOVE_STAGING"
        run: node scripts/populate_us_rates.js

      # ── Pass 2: Post-SC ruling snapshot — entryDate=2026-02-26 (ruling date onward)
      # IEEPA surcharges suspended from 26 Feb 2026.
      # Writes to source=WOVE_TODAY / WOVE_TODAY_STAGING
      - name: Sync post-SC ruling rates (WOVE_TODAY — 26 Feb 2026+, IEEPA suspended)
        env:
          WOVE_CLIENT_ID: ${{ secrets.WOVE_CLIENT_ID }}
          WOVE_CLIENT_SECRET: ${{ secrets.WOVE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESET_EXISTING: "true"
          WOVE_REQUEST_DELAY_MS: "300"
          WOVE_MAX_RETRIES: "6"
          WOVE_RETRY_BASE_MS: "1500"
          WOVE_RETRY_JITTER_MS: "400"
          WOVE_ENTRY_DATE: "2026-02-26"
          WOVE_SOURCE_LIVE: "WOVE_TODAY"
          WOVE_SOURCE_STAGING: "WOVE_TODAY_STAGING"
        run: node scripts/populate_us_rates.js
